name: IPL 2026 Pipeline

on:
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════════════════
  # NIGHTLY FULL PIPELINE
  # Runs: every day at 12 AM IST (6 PM UTC)
  # ════════════════════════════════════════════════════════════
  update_results:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      # ── Download previous artifacts ─────────────────────────
      # Also saves previous 2026 count for regression check later
      - name: Download existing artifacts
        run: |
          curl -f -L -o artifacts.zip \
            https://github.com/mohdfahad20/IPL-2026-Live-Prediction/releases/download/latest-data/artifacts.zip \
            || echo "No existing release found — will build from scratch"

          if [ -f artifacts.zip ]; then
            unzip -o artifacts.zip
            rm artifacts.zip
            echo "Artifacts extracted"
            PREV=$(python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          s2026 = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          total = conn.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          conn.close()
          print(f'DB loaded: {total} total matches, {s2026} in 2026', flush=True)
          import sys; sys.stdout.flush()
          print(s2026)
          " | tail -1)
            echo "PREV_2026_COUNT=$PREV" >> $GITHUB_ENV
            echo "Previous 2026 count saved: $PREV"
          else
            echo "No artifacts found — fresh build"
            echo "PREV_2026_COUNT=0" >> $GITHUB_ENV
          fi

      # ── Dataset download ────────────────────────────────────
      - name: Install gdown
        run: pip install gdown

      - name: Download dataset
        run: |
          mkdir -p data
          gdown https://drive.google.com/uc?id=1i0fgnUjKEwQuGyMEfZq0JC26A8ZcEKAZ -O data/IPL.csv

      - name: Verify dataset
        run: |
          if [ ! -s "data/IPL.csv" ]; then
            echo "Dataset download failed"
            exit 1
          fi
          echo "Dataset ready: $(wc -l < data/IPL.csv) rows"

      # ── Initialize DB if truly missing ──────────────────────
      - name: Initialize DB if missing
        run: |
          if [ ! -f "ipl.db" ]; then
            echo "DB missing — building from Kaggle CSV"
            python data/load_kaggle_data.py --csv data/IPL.csv --db ipl.db
          else
            python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          total = conn.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          conn.close()
          print(f'DB exists with {total} matches — skipping init')
          "
          fi

      # ── Clean 2026 data before fresh scrape ─────────────────
      - name: Clean 2026 season data
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          before = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.execute(\"DELETE FROM matches WHERE season='2026'\")
          conn.commit()
          conn.close()
          print(f'Deleted {before} stale 2026 matches — ready for fresh scrape')
          "

      # ── Scrape 2026 matches ─────────────────────────────────
      - name: Scrape matches
        run: python scraper/scrapper_data.py --db ipl.db

      # ── Fix stages using objectId (idempotent safety net) ───
      # New scraper already writes correct stages via objectId map.
      # This step is a safety net in case any slipped through.
      # Uses match_id (format: '2026_{objectId}') for exact matching.
      - name: Fix match stages
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')

          # Fix any residual bad stage values → League
          conn.execute(\"\"\"
              UPDATE matches
              SET stage = 'League'
              WHERE season = '2026'
              AND stage IN ('FINISHED', 'RUNNING', 'Unknown', 'Group', '')
          \"\"\")

          # Fix playoff stages using match_id (objectId-based, since event_match_no is always None)
          playoff_map = {
              '2026_1535462': 'Qualifier 1',
              '2026_1535463': 'Eliminator',
              '2026_1535464': 'Qualifier 2',
              '2026_1535465': 'Final',
          }
          for match_id, stage_name in playoff_map.items():
              conn.execute(\"\"\"
                  UPDATE matches SET stage = ?
                  WHERE season = '2026' AND match_id = ?
              \"\"\", (stage_name, match_id))

          conn.commit()

          rows = conn.execute(\"\"\"
              SELECT stage, COUNT(*) FROM matches
              WHERE season='2026' GROUP BY stage ORDER BY stage
          \"\"\").fetchall()
          print('2026 stage breakdown after fix:')
          for r in rows:
              print(f'  {r[0]}: {r[1]}')
          conn.close()
          "

      # ── Guard 1: Scrape count floor ─────────────────────────
      # 70 league + up to 4 playoffs = max 74. Floor = 68 (safe)
      - name: Verify scrape count
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          cnt = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.close()
          print(f'2026 matches after scrape: {cnt}')
          if cnt < 68:
              raise SystemExit(f'ABORTING: only {cnt} matches — scrape incomplete or cricinfo down')
          print(f'Scrape count verified OK ({cnt} matches)')
          "

      # ── Guard 2: Count regression check ────────────────────
      - name: Check match count regression
        run: |
          python -c "
          import sqlite3, os
          conn = sqlite3.connect('ipl.db')
          current = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.close()
          prev = int(os.environ.get('PREV_2026_COUNT', '0'))
          print(f'Previous count: {prev}  |  Current count: {current}')
          if prev > 0 and current < prev - 1:
              raise SystemExit(f'COUNT REGRESSION: had {prev} matches, now only {current} — aborting to preserve last good artifacts')
          print('Count regression check passed')
          "
        env:
          PREV_2026_COUNT: ${{ env.PREV_2026_COUNT }}

      # ── Guard 3: Data quality validation ───────────────────
      - name: Validate scraped data quality
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          errors = []

          # Check 1: No bad stage values
          bad_stages = conn.execute(\"\"\"
              SELECT COUNT(*) FROM matches
              WHERE season='2026'
              AND stage IN ('FINISHED', 'RUNNING', 'Unknown', 'Group')
          \"\"\").fetchone()[0]
          if bad_stages > 0:
              errors.append(f'BAD STAGES: {bad_stages} rows with wrong stage values')

          # Check 2: No duplicate match_ids
          dupes = conn.execute(\"\"\"
              SELECT match_id, COUNT(*) as cnt FROM matches
              WHERE season='2026'
              GROUP BY match_id HAVING cnt > 1
          \"\"\").fetchall()
          if dupes:
              errors.append(f'DUPLICATES: {len(dupes)} duplicate match_ids — {dupes[:3]}')

          # Check 3: No null team names
          nullteams = conn.execute(\"\"\"
              SELECT COUNT(*) FROM matches
              WHERE season='2026'
              AND (team1 IS NULL OR team2 IS NULL)
          \"\"\").fetchone()[0]
          if nullteams > 0:
              errors.append(f'NULL TEAMS: {nullteams} matches missing team names')

          # Check 4: Playoff match_ids have correct stages
          playoff_checks = {
              '2026_1535462': 'Qualifier 1',
              '2026_1535463': 'Eliminator',
              '2026_1535464': 'Qualifier 2',
              '2026_1535465': 'Final',
          }
          for mid, expected_stage in playoff_checks.items():
              row = conn.execute(\"SELECT stage FROM matches WHERE match_id=?\", (mid,)).fetchone()
              if row and row[0] != expected_stage:
                  errors.append(f'WRONG STAGE: {mid} has stage={row[0]}, expected={expected_stage}')

          conn.close()

          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              raise SystemExit('Data quality validation FAILED — aborting pipeline.')
          print('All data quality checks passed')
          "

      # ── Scrape standings ────────────────────────────────────
      - name: Scrape standings
        run: python scrape_standings.py --db ipl.db

      # ── Feature engineering ─────────────────────────────────
      - name: Feature engineering
        run: python features/features.py --db ipl.db

      # ── Train model ─────────────────────────────────────────
      - name: Train model
        run: python model/train.py --db ipl.db

      # ── Run simulation ──────────────────────────────────────
      - name: Run simulation
        run: python -m simulate.simulate --db ipl.db --n 10000

      # ── Log results ─────────────────────────────────────────
      - name: Log results
        run: python logger.py --db ipl.db

      # ── Package artifacts ───────────────────────────────────
      - name: Package artifacts
        run: |
          zip -r artifacts.zip ipl.db models/ standings.json
          echo "Artifact size: $(du -sh artifacts.zip)"

      # ── Upload to GitHub Release ────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-data
          name: "Latest IPL Data"
          files: artifacts.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Trigger Render redeploy ─────────────────────────────
      - name: Trigger Render redeploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render redeploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping"
          fi

      # ── Commit logs only (no binary files) ──────────────────
      - name: Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add winner_log.csv match_predictions_log.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "auto update: logs [$(date -u)]"
            git push
          else
            echo "No log changes to commit"
          fi