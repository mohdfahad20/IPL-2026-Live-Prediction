name: IPL 2026 Pipeline

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "*/5 13-15 * * 1-5"
    - cron: "*/5 9-15 * * 0,6"

  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — NIGHTLY FULL PIPELINE
  # Runs: every day at 12 AM IST (6 PM UTC)
  # ════════════════════════════════════════════════════════════
  update_results:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * *'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      # ── Download previous artifacts ─────────────────────────
      - name: Download existing artifacts
        run: |
          curl -f -L -o artifacts.zip \
            https://github.com/mohdfahad20/IPL-2026-Live-Prediction/releases/download/latest-data/artifacts.zip \
            || echo "No existing release found — will build from scratch"

          if [ -f artifacts.zip ]; then
            unzip -o artifacts.zip
            rm artifacts.zip
            echo "Artifacts extracted"
            python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          total = conn.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          s2026 = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.close()
          print(f'DB loaded: {total} total matches, {s2026} in 2026')
          "
          else
            echo "No artifacts found — fresh build"
          fi

      # ── Dataset download ────────────────────────────────────
      - name: Install gdown
        run: pip install gdown

      - name: Download dataset
        run: |
          mkdir -p data
          gdown https://drive.google.com/uc?id=1i0fgnUjKEwQuGyMEfZq0JC26A8ZcEKAZ -O data/IPL.csv

      - name: Verify dataset
        run: |
          if [ ! -s "data/IPL.csv" ]; then
            echo "Dataset download failed"
            exit 1
          fi
          echo "Dataset ready: $(wc -l < data/IPL.csv) rows"

      # ── Initialize DB if truly missing ──────────────────────
      - name: Initialize DB if missing
        run: |
          if [ ! -f "ipl.db" ]; then
            echo "DB missing — building from Kaggle CSV"
            python data/load_kaggle_data.py --csv data/IPL.csv --db ipl.db
          else
            python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          total = conn.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          conn.close()
          print(f'DB exists with {total} matches — skipping init')
          "
          fi

      # ── Clean 2026 data before fresh scrape ─────────────────
      # Required because Kaggle CSV already contains some 2026
      # matches — without this delete we get duplicates
      - name: Clean 2026 season data
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          before = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.execute(\"DELETE FROM matches WHERE season='2026'\")
          conn.commit()
          conn.close()
          print(f'Deleted {before} stale 2026 matches — ready for fresh scrape')
          "

      # ── Scrape 2026 matches ─────────────────────────────────
      - name: Scrape matches
        run: python scraper/scrapper_data.py --db ipl.db

      # ── Guard — abort if scrape looks incomplete ─────────────
      # Prevents bad data from propagating to features/model/sim
      # Threshold = 35 (safe floor for mid-season, currently at 40)
      - name: Verify scrape count
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          cnt = conn.execute(\"SELECT COUNT(*) FROM matches WHERE season='2026'\").fetchone()[0]
          conn.close()
          print(f'2026 matches after scrape: {cnt}')
          if cnt < 35:
              raise SystemExit(f'ABORTING: only {cnt} matches scraped — scrape incomplete or cricinfo is down')
          print(f'Scrape verified OK ({cnt} matches)')
          "

      # ── Scrape standings ────────────────────────────────────
      - name: Scrape standings
        run: python scrape_standings.py

      # ── Feature engineering ─────────────────────────────────
      - name: Feature engineering
        run: python features/features.py --db ipl.db

      # ── Train model ─────────────────────────────────────────
      - name: Train model
        run: python model/train.py --db ipl.db

      # ── Run simulation ──────────────────────────────────────
      - name: Run simulation
        run: python -m simulate.simulate --db ipl.db --n 10000

      # ── Log results ─────────────────────────────────────────
      - name: Log results
        run: python logger.py --db ipl.db

      # ── Package artifacts ───────────────────────────────────
      - name: Package artifacts
        run: |
          zip -r artifacts.zip ipl.db models/ standings.json
          echo "Artifact size: $(du -sh artifacts.zip)"

      # ── Upload to GitHub Release ────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-data
          name: "Latest IPL Data"
          files: artifacts.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Trigger Render redeploy ─────────────────────────────
      - name: Trigger Render redeploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render redeploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping"
          fi

      # ── Commit logs only (no binary files) ──────────────────
      - name: Commit logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add toss_predictions.csv winner_log.csv match_predictions_log.csv || true

          if ! git diff --cached --quiet; then
            git commit -m "auto update: logs [$(date -u)]"
            git push
          else
            echo "No log changes to commit"
          fi


  # ════════════════════════════════════════════════════════════
  # JOB 2 — TOSS PREDICTION (runs during match windows)
  # Weekdays: 6:30 PM - 8:30 PM IST (1 PM - 3 PM UTC)
  # Weekends: 1:30 PM - 3:30 PM IST + 6:30 PM - 8:30 PM IST
  # ════════════════════════════════════════════════════════════
  toss_prediction:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 18 * * *'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements_pipeline.txt

      # ── Download artifacts (need model for prediction) ───────
      - name: Download existing artifacts
        run: |
          curl -f -L -o artifacts.zip \
            https://github.com/mohdfahad20/IPL-2026-Live-Prediction/releases/download/latest-data/artifacts.zip \
            || echo "No artifacts found"

          if [ -f artifacts.zip ]; then
            unzip -o artifacts.zip
            rm artifacts.zip
            echo "Artifacts ready"
          else
            echo "No artifacts — toss predictor may fail without model"
          fi

      # ── Dataset download ────────────────────────────────────
      - name: Install gdown
        run: pip install gdown

      - name: Download dataset
        run: |
          mkdir -p data
          gdown https://drive.google.com/uc?id=1i0fgnUjKEwQuGyMEfZq0JC26A8ZcEKAZ -O data/IPL.csv

      - name: Verify dataset
        run: |
          if [ ! -s "data/IPL.csv" ]; then
            echo "Dataset download failed"
            exit 1
          fi

      # ── Initialize DB if missing ────────────────────────────
      - name: Initialize DB if missing
        run: |
          if [ ! -f "ipl.db" ]; then
            echo "DB missing — building from Kaggle CSV"
            python data/load_kaggle_data.py --csv data/IPL.csv --db ipl.db
          else
            python -c "
          import sqlite3
          conn = sqlite3.connect('ipl.db')
          total = conn.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          conn.close()
          print(f'DB exists with {total} matches')
          "
          fi

      # ── Run toss predictor ──────────────────────────────────
      - name: Run toss predictor
        run: python toss_scraper.py --db ipl.db

      # ── Commit toss log ─────────────────────────────────────
      - name: Commit toss updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add toss_predictions.csv || true

          if ! git diff --cached --quiet; then
            git commit -m "auto update: toss [$(date -u)]"
            git push
          else
            echo "No toss updates today"
          fi